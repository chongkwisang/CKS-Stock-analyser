name: Build & release APK

# Every push builds a signed APK and publishes it as a GitHub Release.
# The app's "Check for update" reads the latest release, so pushing code
# is all it takes to ship an update to installed devices.
on:
  push:
    branches: [main, master, 'ccr-*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Set up release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_NOTE=Signed with the release key." >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - signing with a temporary debug key. In-app updates need the release key; see README."
            echo "SIGNING_NOTE=⚠️ Signed with a temporary debug key (release-key secrets not set yet)." >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --build-name="$VERSION" --build-number="${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk CKS-Stock-Analyser.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CKS-Stock-Analyser-${{ env.VERSION }}
          path: CKS-Stock-Analyser.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: CKS Stock Analyser ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: CKS-Stock-Analyser.apk
          body: |
            ${{ github.event.head_commit.message }}

            ${{ env.SIGNING_NOTE }}
            Install: download **CKS-Stock-Analyser.apk** on your Android device and open it.
